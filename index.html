
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bốn mùa</title>
</head>
<body style="background-color: white;">

    <div style="
        width: 560px;
        margin: 20px auto;
        padding: 20px;
        border: 1px solid #cccccc;
        background-color: #ffffed;
        text-align: center;
    ">

        <h2 style="
            background-color: #ffd6e5;
            color: red;
            margin: 0;
            padding: 5px;
        ">
            BỐN MÙA
        </h2>

        <p style="color: blue; font-style: italic; line-height: 1.5;">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm
        </p>

        <hr style="width: 55%; border: 0; border-top: 1px solid blue;">

        <p style="color: red; font-style: italic; line-height: 1.5;">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr style="width: 55%; border: 0; border-top: 1px solid blue;">

        <p style="color: blue; font-style: italic; line-height: 1.5;">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p>

    </div>

</body>
</html>
